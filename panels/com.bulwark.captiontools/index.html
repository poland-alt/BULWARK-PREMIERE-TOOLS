<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bulwark Caption Tools</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #1e1e1e; color: #e6e6e6; font: 13px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 12px; }
  label { display: block; margin: 0 0 6px; color: #b5b5b5; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  select { width: 100%; padding: 4px; outline: none; margin-bottom: 10px; background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 13px; }
  select option { padding: 4px 6px; border-radius: 4px; }
  select option:checked { background: #3a6ff2 linear-gradient(0deg, #3a6ff2 0%, #3a6ff2 100%); color: #fff; }
  label.check { display: flex; gap: 6px; align-items: center; margin: 0 0 12px; color: #d0d0d0; }
  hr { border: 0; border-top: 1px solid #383838; margin: 18px 0 14px; }
  #rout { margin-top: 10px; color: #b5b5b5; white-space: pre-line; } #rout.ok { color: #7fd38a; } #rout.err { color: #ff7b7b; }
  #review { margin-top: 8px; color: #f0c674; white-space: pre-line; }
  input[type=number] { width: 80px; padding: 6px 8px; background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 14px; }
  button { display: block; width: 100%; padding: 9px 10px; margin-bottom: 8px; background: #3a6ff2; color: #fff; border: 0; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button.secondary { background: #3a3a3a; }
  button:disabled { opacity: .5; cursor: default; }
  #out { margin-top: 10px; min-height: 36px; color: #b5b5b5; white-space: pre-line; }
  #out.ok { color: #7fd38a; } #out.err { color: #ff7b7b; }
  .hint { color: #777; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
  <div id="update"></div>
  <h1>Caption outline <span id="ver" style="color:#777;font-weight:400;font-size:11px;margin-left:6px;"></span></h1>
  <label for="w">Outline Width</label>
  <div class="row"><input id="w" type="number" min="0" max="100" step="0.5" value="9"></div>
  <button id="sel">Apply to selected clips</button>
  <button id="all" class="secondary">Apply to every caption in the sequence</button>
  <div id="out"></div>
  <div class="hint">Works on any Motion Graphics Template clip that has an "Outline Width" control (CaptionX Word Fill and the Bulwark template). Other clips are left alone.</div>
  <script src="lib/CSInterface.js"></script>
  <script src="lib/update-source.js"></script>
  <script src="lib/updater.js"></script>
  <script>
    var csi = new CSInterface();
    BulwarkUpdater.start({ panel: 'com.bulwark.captiontools', banner: document.getElementById('update'), versionEl: document.getElementById('ver') });
    var out = document.getElementById('out');
    // ---- Caption outline ----
    function run(scope) {
      var w = parseFloat(document.getElementById('w').value);
      if (!(w >= 0)) { out.className = 'err'; out.textContent = 'Enter an outline width of 0 or more.'; return; }
      var btns = [document.getElementById('sel'), document.getElementById('all')];
      for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
      out.className = ''; out.textContent = 'Working…';
      csi.evalScript('$.bulwark.setOutline(' + w + ',"' + scope + '")', function (r) {
        for (var j = 0; j < btns.length; j++) btns[j].disabled = false;
        var p = String(r || '').split('|');
        if (p.length < 4) { out.className = 'err'; out.textContent = 'Premiere did not answer: ' + r; return; }
        var updated = +p[0], noControl = +p[1], notGraphic = +p[2], err = p.slice(3).join('|');
        if (err) { out.className = 'err'; out.textContent = err; return; }
        var msg = 'Set Outline Width to ' + w + ' on ' + updated + ' caption' + (updated === 1 ? '' : 's') + '.';
        if (noControl) msg += '\n' + noControl + ' graphic' + (noControl === 1 ? ' has' : 's have') + ' no Outline Width control, left alone.';
        if (notGraphic && scope === 'selected') msg += '\n' + notGraphic + ' selected clip' + (notGraphic === 1 ? ' is' : 's are') + ' not a graphic, left alone.';
        out.className = updated ? 'ok' : ''; out.textContent = msg;
      });
    }
    document.getElementById('sel').addEventListener('click', function () { run('selected'); });
    document.getElementById('all').addEventListener('click', function () { run('all'); });
  </script>
</body>
</html>
